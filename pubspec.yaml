name: vende_movil
description: Mini sistema POS para tienditas/bodegas pequeñas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2

  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Escaneo de códigos de barras y QR
  mobile_scanner: ^7.4.0

  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils_plus: any

  image_picker: ^1.1.2

  intl: ^0.19.0

  uuid: ^4.4.0

  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
