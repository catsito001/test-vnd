name: vende_movil
description: Mini sistema POS para tienditas/bodegas pequeñas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Base de datos local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Escaneo de código de barras
  mobile_scanner: ^5.2.3

  # Impresión térmica ESC/POS por Bluetooth clásico.
  # (`esc_pos_bluetooth` quedó abandonado desde 2021 y ya no compila con
  # Android/Gradle actuales — usamos `print_bluetooth_thermal` para el
  # transporte Bluetooth, manteniendo `esc_pos_utils` para generar el ticket)
  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils: ^1.1.0

  # Foto de producto / QR de Yape
  image_picker: ^1.1.2

  # Formato de moneda (S/ 0.00)
  intl: ^0.19.0

  # IDs cortos de venta
  uuid: ^4.4.0

  # Permisos en tiempo de ejecución (cámara, bluetooth)
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
