name: vende_movil
description: Mini sistema POS para tienditas/bodegas pequeñas.
publish_to: "none"
version: 1.0.0+1

environment:
  # Piso subido de 3.7.0 a 3.11.0: file_picker 12.x pide Dart >=3.10 y
  # share_plus 13.x pide Dart >=3.11 (ver el pubspec de abajo). El Flutter
  # "stable" que usa el workflow ya trae un Dart bastante más nuevo que
  # eso — esto es solo para que el piso declarado sea honesto.
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Base de datos local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Escaneo de código de barras
  #
  # Subido de 5.2.3 a 7.4.0 (ago. 2026): 5.2.3 tiene más de un año y en el
  # medio hubo varias correcciones puntuales a la inicialización nativa de
  # la cámara en Android —incluyendo casos de pantalla negra/crash sin
  # mensaje de error al llamar a start()— que encajan con el
  # "Attempt to invoke virtual method ... on a null object reference" que
  # tira esta app. La API que usa el proyecto (MobileScannerController con
  # `formats`, `.dispose()`, `.toggleTorch()`, `.switchCamera()` sin
  # argumentos, `.start()`, el widget con `controller`/`onDetect`/
  # `errorBuilder`, y `MobileScannerException.errorDetails`) no cambió
  # entre medio, así que no hace falta tocar el código de lib/.
  #
  # Requisito: 7.x pide Flutter >=3.29 / Dart >=3.7, bien por debajo del
  # piso del `sdk:` de arriba (que hoy lo marcan file_picker/share_plus).
  # Correr `flutter --version` antes de `flutter pub get`; si tu Flutter
  # es más viejo, `flutter upgrade` primero.
  mobile_scanner: ^7.4.0

  # Impresión térmica ESC/POS por Bluetooth clásico.
  # (`esc_pos_bluetooth` quedó abandonado desde 2021 y ya no compila con
  # Android/Gradle actuales — usamos `print_bluetooth_thermal` para el
  # transporte Bluetooth. `esc_pos_utils` [el original] fija una versión
  # vieja del paquete `image` incompatible con print_bluetooth_thermal, así
  # que generamos el ticket con `esc_pos_utils_plus`, el fork mantenido que
  # la propia documentación de print_bluetooth_thermal recomienda por esto
  # mismo — misma API, sin el choque de versiones.)
  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils_plus: any

  # Foto de producto / QR de Yape
  image_picker: ^1.1.2

  # Formato de moneda (S/ 0.00)
  intl: ^0.19.0

  # IDs cortos de venta
  uuid: ^4.4.0

  # Permisos en tiempo de ejecución (cámara, bluetooth)
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.6

  # Sonido de éxito al capturar el código de un producto
  audioplayers: ^6.0.0

  # Respaldo de inventario (zip con fotos) y exportar Historial a Excel
  archive: ^3.6.1
  #
  # share_plus + file_picker suben JUNTOS a propósito (ver el porqué de
  # cada uno abajo) — bajar solo uno de los dos vuelve a romper
  # `flutter pub get` con el mismo choque de win32 que ya tuvimos.
  #
  # share_plus: desde la 13.0.0 subió su dependencia de win32 a ^6.0.1
  # (antes ^5.5.3, breaking change). Necesario para que sea compatible con
  # file_picker 12.x — ver el comentario de file_picker.
  share_plus: ^13.3.0
  # file_picker: dos problemas distintos, y los dos se resuelven subiendo
  # a la línea 12.x (NO alcanza con quedarse en 11.x):
  #
  # 1) compileSdk: antes de la 10.3.3 traía su PROPIO compileSdk fijo y
  #    bajo en su build.gradle (nada que ver con Flutter ni con este
  #    proyecto) — por eso fallaba con "file_picker is currently compiled
  #    against android-34". Arreglado desde la 10.3.3, mucho antes de la
  #    12.x, así que esto ya no es un problema en ninguna versión que
  #    usemos.
  #
  # 2) Registro del plugin en Android — "cannot find symbol ...
  #    FilePickerPlugin" al compilar el APK: la 11.0.0 rompió el registro
  #    en proyectos con AGP < 9 (arreglado en la 11.0.1), pero tiene un
  #    problema de registro DISTINTO con AGP 9+ (el que trae el `flutter
  #    create` de un Flutter stable actual), arreglado recién en la línea
  #    12.x (12.0.0-beta.3 en adelante). De paso, desde la beta.4 dejó de
  #    aplicar el Kotlin Gradle Plugin a mano (era la causa del warning
  #    "Future versions of Flutter will fail to build..." que salía en el
  #    log de build). Por esto 11.0.3 (la última de la serie 11.x) TODAVÍA
  #    fallaba acá, aunque ya tuviera el fix de compileSdk del punto 1.
  #
  # El motivo por el que antes se había evitado la 12.x era que arrastra
  # windows_file_picker (pide win32 ^6.3.0), que chocaba con share_plus
  # (pedía win32 ^5.5.3 hasta su propia 12.x). Subiendo share_plus a
  # ^13.3.0 (arriba) ese choque desaparece.
  #
  # La 12.0.0 además cambió pickFiles(): ya no devuelve FilePickerResult?,
  # devuelve List<PlatformFile> directo (breaking change), y agregó
  # pickFile() para elegir un solo archivo, devolviendo PlatformFile?
  # directo. Como acá siempre se elige un único .zip, se cambió
  # lib/utils/inventory_backup.dart para usar pickFile() en vez de
  # pickFiles() — más simple para este caso.
  file_picker: ^12.1.2
  excel: ^4.0.0
  cross_file: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/success.wav
